<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>

<body>
{% include 'alert.html' %}
<div class="row">
    {% include 'employee_sidebar.html' %}
    
    <div class="col-md-10 main-content">
    <div class="glass-card">
        <div class="row">

            <div class="col-md-3 text-center">

                <img src="{{ employee.profile_picture.url }}" class="profile-img">
     
                <h4 class="mt-3">
                    {{employee.fullname}}
                </h4>
                
                <div class="mt-3">
                    <form id="photoForm" method="POST"   action="{% url 'change_photo' %}"  enctype="multipart/form-data">
                    {% csrf_token %}
                    <label
                        for="profile_picture"
                        class="btn btn-sm btn-outline-info">
                        <i class="fa-solid fa-camera"></i>
                        Change Photo
                    </label>
                    <input
                        type="file"
                        id="profile_picture"
                        name="profile_picture"
                        accept=".jpg,.jpeg,.png"
                        style="display:none;">
                    </form>
                </div>
            </div>
            

            <div class="col-md-9">

                <h2 class="page-title">
                    My Profile
                </h2>

                <form method="POST"   action="{% url 'edit_profile' %}"   enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Employee ID
                            </label>

                            <input type="text"
                                   name="employee_id"
                                   value="{{ employee.employee_id }}"
                                   readonly
                                   class="form-control readonly-field">
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   name="fullname"
                                   value="{{ employee.fullname }}"
                                   class="form-control">
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Department
                            </label>

                            <input type="text"
                                   name="department"
                                   value="{{ employee.department }}"
                                   class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Designation
                            </label>

                            <input type="text"
                                   name="designation"
                                   value="{{ employee.designation }}"
                                   class="form-control">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   name="email"
                                   value="{{ employee.email }}"
                                   class="form-control">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Phone Number
                            </label>

                            <input type="text"
                                   name="phone"
                                   value="{{ employee.phone }}"
                                   class="form-control">
                        </div>
                    </div>

                    <hr>

                    <h4 class="mb-3">Change Password</h4>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <input type="password"
                                   name="current_password"
                                   class="form-control"
                                   placeholder="Current Password">
                        </div>

                        <div class="col-md-4 mb-3">
                            <input type="password"
                                   name="new_password"
                                   class="form-control"
                                   placeholder="New Password">
                        </div>

                        <div class="col-md-4 mb-3">
                            <input type="password"
                                   name="confirm_password"
                                   class="form-control"
                                   placeholder="Confirm Password">
                        </div>

                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit"
                                class="btn btn-theme">
                            <i class="fa-solid fa-floppy-disk"></i>
                            Save Changes
                        </button>
                        
                        <a href="{% url 'employee_profile' %}"   class="btn btn-secondary" classsolid fa-xmark>
                           <i class="fa-solid fa-xmark"></i>
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</div>

<script>
document.addEventListener(
    "DOMContentLoaded",
    function () {
        const fileInput = document.getElementById("profile_picture");
        fileInput.addEventListener(
            "change",function () {
                if(this.files.length > 0){
                    document.getElementById("photoForm").submit();
                    }
                }
            );
        }
    );
</script>

</body>
</html>
