<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>

<body>
{% include 'alert.html' %}
<div class="container-fluid">
<div class="row">

    <!-- Sidebar -->

    {% include 'admin_sidebar.html' %}
    <!-- Main Content -->

    <div class="col-md-10 main-content">

    <!-- Camera Section -->

    <div class="glass-card mt-5" id="camera">
    
        <h3 class="section-title">
            Camera Operation
        </h3>
    
        <div id="mode-label">
            Current Mode : Not Selected
        </div>
    
        <!-- Camera Container -->
    
        <div class="camera-box" id="camera-container" style="position:relative; overflow:hidden;">
    
            <i id="camera-icon" class="fa-solid fa-camera"></i>
        
            <video
                id="video"
                autoplay
                playsinline
                muted
                style="
                    width:100%;
                    height:100%;
                    object-fit:cover;
                    display:none;
                    border-radius:15px;
                ">
            </video>
        
            <canvas
                id="overlay"
                style="
                    position:absolute;
                    top:0;
                    left:0;
                    width:100%;
                    height:100%;
                    pointer-events:none;
                ">
            </canvas>
        </div>
    
        <!-- Buttons -->
    
        <div class="mt-3">
    
            <button id="checkin-btn" class="btn btn-theme me-2">
                Check-In Camera
            </button>
    
            <button id="checkout-btn" class="btn btn-theme me-2">
                Check-Out Camera
            </button>
    
            <button id="stop-camera-btn" class="btn btn-danger">
                Stop Camera
            </button>
    
        </div>
      </div>
    </div>

</div>
</div>


<script>

let currentMode = null;

let cameraStarted = false;

let detectionInterval = null;

let cameraStream = null;

const video = document.getElementById( "video" );

const overlay = document.getElementById( "overlay" );

const ctx = overlay.getContext("2d");


// CHECK-IN BUTTON //

document
.getElementById( "checkin-btn" )
.addEventListener(
    "click", async ()=> {
        currentMode = "checkin";
        document.getElementById("mode-label")
        .innerText ="Current Mode : CHECK-IN";
        await startCamera();
    }
);


// CHECK-OUT BUTTON //

document
.getElementById( "checkout-btn" )
.addEventListener(
    "click",
    async ()=>{
        currentMode = "checkout";
        document.getElementById("mode-label")
        .innerText = "Current Mode : CHECK-OUT";
        await startCamera();
    }
);


// START CAMERA //
// 'async' -> it's asunchronus function, continuoysly sending frames. having 'await' inside
async function startCamera(){
    document
    .getElementById("camera-icon")
    .style.display = "none";

    video.style.display = "block";

    if(cameraStarted){
        return;
    }
    
    try{
        const stream = await navigator.mediaDevices.getUserMedia({ video:true });
        cameraStream = stream;
        
        video.srcObject = stream;
        video.onloadedmetadata = () => {
            overlay.width = video.videoWidth;
            overlay.height = video.videoHeight;
        };
        cameraStarted = true;

        detectionInterval = setInterval(
            detectFaces,
            1000
        );
    }
    catch(error){
        console.error(error);
        alert(
            "Unable to access camera."
        );
    }
}


// STOP CAMERA //
//There is no 'async' before function because its just doing task instantly single time
document
.getElementById( "stop-camera-btn")
.addEventListener( "click", stopCamera);

function stopCamera(){
    document.getElementById("camera-icon")
    .style.display = "block";
    
    video.style.display = "none";
    
    if(cameraStream){
        cameraStream
        .getTracks()
        .forEach(track => {
            track.stop();
        });
        cameraStream = null;
    }

    if(detectionInterval){
        clearInterval(
            detectionInterval
        );
        detectionInterval = null;
    }
    video.pause();
    video.srcObject = null;
    cameraStarted = false;
    currentMode = null;

    // Clear overlay completely

    ctx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );

    overlay.width = overlay.width;

    // Clear video frame

    video.removeAttribute("src");

    document
    .getElementById( "mode-label")
    .innerText = "Current Mode : Stopped";
}

//
// DETECT FACES
//

async function detectFaces(){

    if(currentMode === null){
        return;
    }
    if(video.videoWidth === 0){
        return;
    }

    const canvas = document.createElement( "canvas" );

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const context = canvas.getContext( "2d" );

    context.drawImage(
        video,
        0,
        0
    );

    canvas.toBlob(
        async function(blob){
            try{
                const formData = new FormData();
                formData.append(
                    "image",
                    blob,
                    "frame.jpg"
                );

                formData.append(
                    "mode",
                    currentMode
                );

                const response =
                await fetch(
                    "/attendance/detect_faces/",
                    {
                        method:"POST",
                        body:formData
                    }
                );

                if( !response.ok ){
                    return;
                }
                const data = await response.json();
                drawFaces( data.faces );
            }
            catch(error){
                console.error(
                    error
                );
            }
        },
        "image/jpeg"
    );
}


//
// DRAW FACES
//

function drawFaces(faces){
    ctx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );

    faces.forEach(face => {
        const [
            x1,
            y1,
            x2,
            y2
        ] = face.bbox;

        if( face.recognized ){
            ctx.strokeStyle = "green";
            ctx.fillStyle = "green";
        }
        else{
            ctx.strokeStyle = "red";
            ctx.fillStyle = "red";
        }
        
        ctx.lineWidth = 3;
        ctx.strokeRect(
            x1,
            y1,
            x2 - x1,
            y2 - y1
        );

        ctx.font = "16px Arial";

        ctx.fillText(
            face.label,
            x1,
            y1 - 10
        );
    });
}
</script>
</body>
</html>
